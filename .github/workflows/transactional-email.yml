name: Process transactional email outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  process-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke the protected email worker
        env:
          TRANSACTIONAL_EMAIL_PRODUCTION_URL: ${{ secrets.TRANSACTIONAL_EMAIL_PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$TRANSACTIONAL_EMAIL_PRODUCTION_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 55 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${TRANSACTIONAL_EMAIL_PRODUCTION_URL%/}/api/cron/transactional-email"
